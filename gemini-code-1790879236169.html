<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NAVOX AI Agent</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        html, body { background-color: #07090e; color: #f8fafc; width: 100%; height: 100%; overflow: hidden; }
        body { display: flex; flex-direction: column; }

        .app-header {
            padding: 12px 16px;
            background-color: #0f172a;
            border-bottom: 1px solid #1e293b;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-logo {
            width: 34px;
            height: 34px;
            background: linear-gradient(135deg, #0284c7, #2563eb);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1rem;
        }

        .header-title { font-size: 1rem; font-weight: 600; color: #ffffff; }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .welcome-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            margin: auto 0;
            gap: 12px;
        }

        .hexagon-logo {
            width: 64px;
            height: 64px;
            background: #0f172a;
            border: 2px solid #38bdf8;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #38bdf8;
            font-size: 1.8rem;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }

        .brand-name { font-size: 1.4rem; font-weight: 700; letter-spacing: 1px; color: #ffffff; }
        .brand-tagline { font-size: 0.75rem; font-weight: 600; color: #38bdf8; text-transform: uppercase; letter-spacing: 2px; margin-top: -6px; }
        .brand-desc { font-size: 0.85rem; color: #94a3b8; max-width: 280px; }

        .message { display: flex; gap: 10px; max-width: 100%; width: 100%; }
        .message.user { flex-direction: row-reverse; }
        .message-content {
            background-color: #1e293b;
            border: 1px solid #334155;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.9rem;
            color: #f8fafc;
            max-width: 85%;
        }
        .message.user .message-content { background-color: #2563eb; border: none; }

        .chat-input-area {
            padding: 12px 16px 16px 16px;
            background-color: #0f172a;
            border-top: 1px solid #1e293b;
        }

        .input-wrapper {
            background-color: #131b2e;
            border: 1px solid #334155;
            border-radius: 14px;
            display: flex;
            align-items: center;
            padding: 8px 12px 8px 14px;
            gap: 10px;
        }

        .input-wrapper textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 0.95rem;
            resize: none;
            max-height: 100px;
            outline: none;
        }

        .send-btn {
            background: #2563eb;
            color: white;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="app-header">
        <div class="header-logo"><i class="fa-solid fa-cube"></i></div>
        <div class="header-title">NAVOX AI</div>
    </div>

    <div class="chat-messages" id="chatMessages">
        <div class="welcome-container" id="welcomeContainer">
            <div class="hexagon-logo"><i class="fa-solid fa-cube"></i></div>
            <div class="brand-name">NAVOX</div>
            <div class="brand-tagline">think. plan. act.</div>
            <div class="brand-desc">Type a command to launch apps or search</div>
        </div>
    </div>

    <div class="chat-input-area">
        <div class="input-wrapper">
            <textarea id="userInput" placeholder="Ask NAVOX..." rows="1"></textarea>
            <button class="send-btn" id="sendBtn"><i class="fa-solid fa-arrow-up"></i></button>
        </div>
    </div>

    <script>
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatMessages = document.getElementById('chatMessages');
        const welcomeContainer = document.getElementById('welcomeContainer');

        function addMessage(text, sender) {
            if (welcomeContainer) welcomeContainer.style.display = 'none';
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.innerHTML = `<div class="message-content">${text}</div>`;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function launchApp(uri, storeUrl, name) {
            addMessage(`Opening ${name}...`, 'bot');
            window.location.href = uri;
            setTimeout(() => {
                let iframe = document.createElement('iframe');
                iframe.style.display = 'none';
                iframe.src = uri;
                document.body.appendChild(iframe);
                setTimeout(() => document.body.removeChild(iframe), 500);
            }, 500);
        }

        function processCommand(text) {
            let l = text.toLowerCase();
            if (l.includes('instagram')) launchApp("instagram://", "https://play.google.com/store/apps/details?id=com.instagram.android", "Instagram");
            else if (l.includes('telegram')) launchApp("tg://", "https://play.google.com/store/apps/details?id=org.telegram.messenger", "Telegram");
            else if (l.includes('free fire') || l.includes('freefire')) launchApp("freefireth://", "https://play.google.com/store/apps/details?id=com.dts.freefireth", "Free Fire");
            else if (l.includes('whatsapp')) launchApp("whatsapp://", "https://play.google.com/store/apps/details?id=com.whatsapp", "WhatsApp");
            else if (l.includes('youtube')) launchApp("vnd.youtube://", "https://play.google.com/store/apps/details?id=com.google.android.youtube", "YouTube");
            else {
                addMessage(`Searching for: "${text}"`, 'bot');
                setTimeout(() => window.open(`https://www.google.com/search?q=${encodeURIComponent(text)}`, "_blank"), 500);
            }
        }

        function handleSend() {
            let text = userInput.value.trim();
            if (!text) return;
            addMessage(text, 'user');
            userInput.value = '';
            processCommand(text);
        }

        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
        });
    </script>
</body>
</html>
